<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Marker AR demo</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style='margin: 0; overflow: hidden;'>
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Marker that holds the content -->
      <a-marker type="pattern" url="pattern-Pfeil_black_Artboard_4.patt"> 
        <a-image src="star.png" position="1 0 0" rotation="0 0 0" width="1" height="1"></a-image>
        <a-image src="star.png" position="-1 0 0" rotation="0 0 0" width="0.5" height="0.5"></a-image>
        <a-image src="star.png" position="1 2 1" rotation="0 0 0" width="0.25" height="0.25"></a-image>
        <a-image src="star.png" position="-1 3 -1" rotation="0 0 0" width="0.6" height="0.6"></a-image>
        <a-image src="star.png" position="-2 3 1" rotation="0 0 0" width="0.15" height="0.15"></a-image>
        <a-image src="moon.png" position="0 1 -0.25" rotation="0 0 0" width="1" height="1"></a-image>
      </a-marker> 

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
